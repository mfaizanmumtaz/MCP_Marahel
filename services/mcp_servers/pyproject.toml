[project]
name = "marahel-mcp-service"
version = "0.1.0"
description = "MCP service for Marahel project - Translation, Summarization, and Knowledge Base"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core MCP dependencies
    "mcp[cli]>=1.9.4",
    "fastmcp>=2.10.6",
    "pydantic>=2.11.4",
    "python-dotenv>=1.1.0",
    "aiofiles",
    # Database dependencies (for knowledge base)
    "sqlalchemy>=2.0.40",
    "psycopg2-binary>=2.9.10",
    "asyncpg",
    "pgvector>=0.3.6",
    "psycopg[binary,pool]>=3.2.9",
    "psycopg-pool>=3.2.6",
    "fastapi",
    # AI/ML for MCP tools
    "openai>=1.76.2",
    "anthropic>=0.50.0",
    "langchain>=0.3.24",
    "langchain-core>=0.3.56",
    "langchain-openai>=0.3.24",
    "langchain-anthropic>=0.3.12",
    "langchain-google-genai>=2.0.8",
    "google-generativeai>=0.8.3",
    "langchain-community>=0.3.23",
    "langchain-postgres>=0.0.13",
    "langchain-text-splitters>=0.3.8",
    
    # Vector databases
    "qdrant-client>=1.14.2",
    "langchain-qdrant>=0.2.0",
    
    # Document processing (for knowledge base)
    "pymupdf>=1.25.5",
    "pypdf2>=3.0.1",
    "pandas>=2.2.3",
    
    # Utilities
    "requests>=2.32.3",
    "httpx>=0.28.1",
    "aiohttp>=3.11.18",
    "numpy>=2.2.5",
    "langdetect>=1.0.9",
    "async_timeout",
    "filelock>=3.18.0",
]
